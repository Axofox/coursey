<!doctype html>
<html lang="en">
<head>

    <div style="font-size:17px;font-weight:700;font-family:var(--font-display);">My Courses</div>

      <div style="font-size:15px;font-weight:700;font-family:var(--font-display);margin-bottom:12px;">Latest Learned</div>

        <div style="position:relative;display:flex;justify-content:flex-end;">

        <div style="position:absolute;left:18px;bottom:16px;right:18px;color:#fff;">

    </div>

            <div style="font-size:13px;font-weight:700;margin-bottom:2px;">Learn Swift by Doing</div>

              <span style="font-size:10px;color:var(--ink-faint);flex-shrink:0;">4/6 Video</span>
            </div>
          </div>
          <span style="font-size:12px;font-weight:700;color:var(--accent-strong);flex-shrink:0;">30%</span>
        </a>
        <a href="course-detail.html" style="background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px;">

            <div style="font-size:11px;color:var(--ink-soft);margin-bottom:8px;">Author by Samuel</div>

              <span style="font-size:10px;color:var(--ink-faint);flex-shrink:0;">4/8 Video</span>
