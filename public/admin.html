<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Admin — Course Site</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <div class="wrap nav">
    <div class="logo">Your Course Site</div>
    <nav class="nav-links" data-nav-links>
      <a href="index.html">Home</a>
      <button class="theme-toggle" data-theme-toggle>Dark mode</button>
    </nav>
    <button class="menu-btn" data-menu-btn>&#9776;</button>
  </div>
</header>

<main class="wrap" style="padding-top:40px; max-width:640px;">
  <h1 style="margin-bottom:4px;">Admin</h1>
  <p class="muted" style="margin-top:0;">Add and manage categories and courses. Changes go live immediately.</p>

  <div class="notice" data-admin-notice style="display:none;"></div>

  <div class="admin-panel" data-admin-login>
    <h2>Sign in</h2>
    <form data-login-form>
      <div class="field">
        <label for="token">Admin token</label>
        <input type="password" id="token" name="token" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn">Sign in</button>
    </form>
  </div>

  <div data-admin-app style="display:none;">
    <div class="admin-panel">
      <h2 data-category-form-title>Add a category</h2>
      <form data-category-form>
        <div class="field">
          <label for="name">Category name</label>
          <input type="text" id="name" name="name" placeholder="e.g. Mindfulness" required>
        </div>
        <div class="field">
          <label for="description">Short description</label>
          <textarea id="description" name="description" rows="2" placeholder="One line describing this category"></textarea>
        </div>
        <button type="submit" class="btn">Add category</button>
        <button type="button" class="btn secondary" data-cancel style="display:none;">Cancel</button>
      </form>
    </div>

    <div class="admin-panel">
      <h2>Categories &amp; courses</h2>
      <div data-admin-list><p class="muted">Loading…</p></div>
    </div>

    <p style="text-align:right;"><button class="link-btn" data-signout>Sign out</button></p>
  </div>
</main>

<footer>
  &copy; Your Course Site
</footer>

<script src="api.js"></script>
<script src="admin.js"></script>
<script src="script.js"></script>
</body>
</html>
