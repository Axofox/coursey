<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coursehub — Bundle</title>
<script>(function(){try{if(localStorage.getItem('coursehub-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/styles.css">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<!-- NAV -->
<div style="position:sticky;top:0;z-index:50;background:var(--surface);border-bottom:1px solid var(--border);">
  <div class="container" style="height:76px;display:flex;align-items:center;gap:40px;">
    <a href="index.html" style="display:flex;align-items:center;gap:10px;flex-shrink:0;">
      <svg width="30" height="30" viewBox="0 0 28 28" fill="none"><rect width="28" height="28" rx="8" style="fill:var(--accent);"></rect><polygon points="11,9 20,14 11,19" style="fill:#fff;"></polygon></svg>
      <span style="font-family:var(--font-display);font-weight:700;font-size:19px;">Coursehub</span>
    </a>
    <div style="flex-grow:1;"></div>
    <button class="iconbtn" aria-label="Toggle dark mode" data-theme-toggle>
      <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
    </button>
    <a class="iconbtn navlink" href="cart.html" data-cart-link style="display:flex;align-items:center;gap:6px;width:auto;padding:0 10px;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
      Cart <span data-cart-badge style="background:var(--accent);color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;padding:0 4px;border-radius:999px;display:flex;align-items:center;justify-content:center;">0</span>
    </a>
    <a href="dashboard.html" style="width:36px;height:36px;border-radius:999px;background:var(--accent-tint);color:var(--accent-strong);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;">AR</a>
  </div>
</div>

<!-- BREADCRUMB -->
<div class="container" style="padding-top:20px;">
  <nav aria-label="Breadcrumb" style="font-size:13px;color:var(--ink-faint);display:flex;gap:6px;" data-breadcrumb>
    <a href="index.html" style="color:var(--ink-faint);">Home</a><span>/</span>
    <a href="index.html#bundles" style="color:var(--ink-faint);">Bundles</a>
  </nav>
</div>

<main id="main" class="container" style="padding-top:20px;padding-bottom:80px;display:grid;grid-template-columns:1fr 380px;gap:56px;align-items:start;">
  <div style="min-width:0;" data-bundle-main><p style="color:var(--ink-faint);font-size:14px;">Loading bundle…</p></div>
  <div style="position:sticky;top:100px;" class="purchase-card-wrap" data-bundle-aside></div>
</main>

<style>
  @media (max-width:900px){
    main#main{ display:flex !important; flex-direction:column; }
    .purchase-card-wrap{ position:static !important; }
  }
</style>

<script src="assets/api.js"></script>
<script src="assets/script.js"></script>
<script src="assets/bundle.js"></script>
</body>
</html>
